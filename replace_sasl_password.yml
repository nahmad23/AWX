---
# Replace the SASL password for the svc_Lrelay relay user in Postfix.
#
# Best practice: do NOT hardcode the password. Override it at runtime, e.g.:
#   ansible-playbook replace_sasl_password.yml -e "sasl_password=ansible@123"
# or store it encrypted with ansible-vault.
#
# The Postfix SASL credentials file is normally /etc/postfix/sasl_passwd
# (a "sasl_password" filename is non-standard; adjust sasl_passwd_file below
# if your environment really uses /etc/postfix/sasl_password).

- name: Update Postfix SASL relay password for svc_Lrelay
  hosts: mail_relays
  become: true

  vars:
    sasl_user: "svc_Lrelay"
    # Provide via --extra-vars or vault instead of leaving it in plaintext.
    sasl_password: "ansible@123"
    sasl_passwd_file: "/etc/postfix/sasl_passwd"

  tasks:
    - name: Ensure the SASL credentials file exists with safe permissions
      ansible.builtin.file:
        path: "{{ sasl_passwd_file }}"
        state: touch
        owner: root
        group: root
        mode: "0600"
      changed_when: false

    - name: Replace the password for svc_Lrelay
      ansible.builtin.lineinfile:
        path: "{{ sasl_passwd_file }}"
        # Match an existing line containing the user (with or without a relayhost prefix)
        regexp: '^(\S*\s*){{ sasl_user }}:.*$'
        line: "{{ relayhost | default('') }}{{ ' ' if relayhost is defined else '' }}{{ sasl_user }}:{{ sasl_password }}"
        owner: root
        group: root
        mode: "0600"
        backrefs: false
      no_log: true
      notify:
        - Rebuild postfix lookup table
        - Reload postfix

  handlers:
    - name: Rebuild postfix lookup table
      ansible.builtin.command:
        cmd: "postmap {{ sasl_passwd_file }}"
      register: postmap_result
      changed_when: postmap_result.rc == 0

    - name: Reload postfix
      ansible.builtin.service:
        name: postfix
        state: reloaded
