---
# ==================================================================
# The playbook that the AWX "Ping All Servers" job template runs.
# It checks SSH + Python connectivity to every managed host.
# ==================================================================
- name: Ping all managed servers
  hosts: all
  gather_facts: false

  tasks:
    - name: Verify connectivity (ansible.builtin.ping)
      ansible.builtin.ping:
      register: ping_result

    - name: Report result
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} -> {{ ping_result.ping | default('unreachable') }}"
