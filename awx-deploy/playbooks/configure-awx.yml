---
# ==================================================================
# Configure AWX over its API: organization, inventory + 10 hosts,
# machine credential, project (this git repo), a "ping" job template,
# then launch it.
#
# Run AFTER install-awx.yml, from any machine that can reach the AWX
# web UI (http://192.168.27.162:30080):
#
#   ansible-playbook playbooks/configure-awx.yml \
#       -e @group_vars/secrets.yml --ask-vault-pass
# ==================================================================
- name: Configure AWX and launch the ping job
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
  vars:
    awx_url: "http://192.168.27.162:{{ awx_nodeport }}"
    # awx.awx modules read these connection vars:
    controller_host: "{{ awx_url }}"
    controller_username: "{{ awx_admin_user }}"
    controller_password: "{{ awx_admin_password }}"
    controller_validate_certs: false

  collections:
    - awx.awx

  tasks:
    - name: Ensure the organization exists
      awx.awx.organization:
        name: "{{ awx_organization }}"
        state: present

    - name: Create the inventory
      awx.awx.inventory:
        name: "{{ awx_inventory_name }}"
        organization: "{{ awx_organization }}"
        state: present

    - name: Add the managed hosts to the inventory
      awx.awx.host:
        name: "{{ item }}"
        inventory: "{{ awx_inventory_name }}"
        state: present
      loop: "{{ managed_hosts }}"

    - name: Create the machine credential AWX uses to reach the servers
      awx.awx.credential:
        name: "{{ awx_credential_name }}"
        organization: "{{ awx_organization }}"
        credential_type: "Machine"
        state: present
        inputs:
          username: "{{ managed_ssh_user }}"
          # Use a password OR an SSH key (set one in secrets.yml):
          password: "{{ managed_ssh_pass | default(omit) }}"
          ssh_key_data: "{{ managed_ssh_key | default(omit) }}"
      no_log: true

    - name: Create the project (source of ping.yml = this git repo)
      awx.awx.project:
        name: "{{ awx_project_name }}"
        organization: "{{ awx_organization }}"
        scm_type: git
        scm_url: "{{ awx_project_scm_url }}"
        scm_branch: "{{ awx_project_scm_branch }}"
        scm_update_on_launch: true
        state: present

    - name: Create the ping job template
      awx.awx.job_template:
        name: "{{ awx_job_template_name }}"
        job_type: run
        organization: "{{ awx_organization }}"
        inventory: "{{ awx_inventory_name }}"
        project: "{{ awx_project_name }}"
        playbook: "awx-deploy/playbooks/ping.yml"
        credentials:
          - "{{ awx_credential_name }}"
        state: present

    - name: Launch the ping job
      awx.awx.job_launch:
        job_template: "{{ awx_job_template_name }}"
      register: ping_job

    - name: Show the launched job URL
      ansible.builtin.debug:
        msg: "Ping job launched: {{ awx_url }}/#/jobs/playbook/{{ ping_job.id }}/output"
