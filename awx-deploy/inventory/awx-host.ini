# Inventory for the host that will RUN AWX (the Ubuntu server).
#
# This is the machine AWX itself gets installed on (k3s + AWX Operator).
# Credentials are NOT stored here. Provide them at runtime, e.g.:
#
#   ansible-playbook playbooks/install-awx.yml \
#       -e @group_vars/secrets.yml --ask-vault-pass
#
# or pass connection vars on the CLI:
#   --extra-vars "ansible_user=root ansible_ssh_pass=CHANGEME ansible_become=true"

[awx_server]
awx ansible_host=192.168.27.162

[awx_server:vars]
ansible_user=root
ansible_become=true
# ansible_ssh_pass=  <-- do NOT hardcode here; use vault (group_vars/secrets.yml)
