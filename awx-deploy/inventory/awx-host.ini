# Inventory for the host that will RUN AWX (the Ubuntu server).
#
# DEFAULT: this file assumes you run the install playbook DIRECTLY ON the
# Ubuntu server (e.g. `root@awx:~/AWX/awx-deploy#`). In that case Ansible
# uses a LOCAL connection -- no SSH, no password needed:
#
#   ansible-playbook playbooks/install-awx.yml -e @group_vars/secrets.yml --ask-vault-pass
#
# (You still need secrets.yml for the AWX admin password, etc.)
#
# ----------------------------------------------------------------------
# ALTERNATIVE: running from a SEPARATE control machine over SSH?
# Comment out the `ansible_connection=local` line below and instead
# provide SSH creds, e.g. set ansible_ssh_pass in group_vars/secrets.yml,
# and make sure sshd on the server allows password auth.
# ----------------------------------------------------------------------

[awx_server]
awx ansible_host=192.168.27.162

[awx_server:vars]
ansible_connection=local
ansible_user=root
ansible_become=true
# ansible_ssh_pass=  <-- only needed for the SSH (remote control machine) case; use vault
