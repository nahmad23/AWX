# Target: the Ubuntu 24.04 server that will run AWX.
#
# DEFAULT assumes you run this playbook ON the server itself (local
# connection, no SSH). To run from a separate control machine instead,
# remove ansible_connection=local and set ansible_user / SSH creds, and
# set ansible_become=true if you connect as a non-root sudo user.

[awx_server]
awx ansible_host=192.168.27.162 ansible_connection=local

[awx_server:vars]
ansible_user=root
ansible_become=false
